name: Build & Upload iOS to TestFlight

# Manual trigger only (workflow_dispatch) so the owner/lead can run it on demand
# from the Actions tab. Only signing secrets (P12 + API key) are read from GitHub
# Actions secrets; Apple identifiers are hardcoded here because they are not
# secret (see /home/team/shared/ios-signing/CI-SETUP.md).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Archive, sign, and upload to TestFlight
    runs-on: macos-26

    # Expose the required secrets as environment variables scoped to this job.
    env:
      P12_BASE64: ${{ secrets.P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_KEY_ID: RR25ZLU234
      APPLE_ISSUER_ID: c7ed6fd2-303c-4b68-9cc7-e43da3dfb5d7
      APPLE_TEAM_ID: J55SPG373Q

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync Capacitor native projects (iOS only)
        run: bunx cap sync ios

      - name: Import signing certificate into a temporary keychain
        env:
          P12_BASE64: ${{ secrets.P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/distribution.p12"

          # Decode the base64-encoded PKCS#12 bundle from the secret.
          # Strip any whitespace/newlines a copy-paste may have introduced (base64
          # has no legitimate whitespace), then decode.
          P12_B64_CLEAN="$(printf '%s' "$P12_BASE64" | tr -d '[:space:]')"
          echo "P12_BASE64 chars (after whitespace strip): ${#P12_B64_CLEAN} (expect 4240)"
          printf '%s' "$P12_B64_CLEAN" | base64 --decode > "$P12_PATH"
          echo "Decoded P12 file size: $(wc -c < "$P12_PATH" | tr -d ' ') bytes (expect 3178)"
          [ -s "$P12_PATH" ] || { echo "ERROR: decoded P12 is empty — P12_BASE64 secret is missing or wrong"; exit 1; }

          # Create an isolated temporary keychain (does not pollute the login keychain).
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"

          # Import the distribution certificate + private key.
          security import "$P12_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Make the temp keychain the default and put it first in the search list,
          # while keeping the login keychain available.
          security default-keychain -s "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Allow codesign/xcodebuild to use the signing identity without prompting.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN_PATH"

          # Verify the identity is visible to codesign.
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          # Persist paths for later steps.
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Install App Store provisioning profile
        run: |
          set -euo pipefail
          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          cp ios/ci/LightningDispatch_AppStore.mobileprovision \
            "$PROFILE_DIR/fad4523a-eb05-4d8a-852e-5c79f0fbf01a.mobileprovision"
          ls -la "$PROFILE_DIR"

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_KEY_ID: RR25ZLU234
        run: |
          set -euo pipefail
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_KEY_ID}.p8"
          printf '%s\n' "$APPLE_API_KEY_P8" > "$AUTH_KEY_PATH"
          grep -q "BEGIN PRIVATE KEY" "$AUTH_KEY_PATH" || { echo "ERROR: APPLE_API_KEY_P8 is missing the PEM 'BEGIN PRIVATE KEY' marker — secret is empty or wrong"; exit 1; }
          chmod 600 "$AUTH_KEY_PATH"
          echo "AUTH_KEY_PATH=$AUTH_KEY_PATH" >> "$GITHUB_ENV"

      - name: Archive (unsigned — signing happens at export)
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/LightningDispatch.xcarchive"
          echo "ARCHIVE_PATH=$ARCHIVE_PATH" >> "$GITHUB_ENV"

          # Build an unsigned .xcarchive. Distribution signing happens later in the
          # Export step, which is `method = app-store-connect` + manual signing with
          # an explicit App Store provisioning profile (committed at ios/ci/) — no
          # devices needed. Signing here would default to DEVELOPMENT and fail with
          # "your team has no devices".
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Generate ExportOptions.plist
        env:
          APPLE_TEAM_ID: J55SPG373Q
        run: |
          set -euo pipefail
          EXPORT_OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          echo "EXPORT_OPTIONS=$EXPORT_OPTIONS" >> "$GITHUB_ENV"

          # Build the plist with PlistBuddy to avoid heredoc/indentation pitfalls.
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">' \
            '<plist version="1.0">' \
            '<dict/>' \
            '</plist>' > "$EXPORT_OPTIONS"

          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :destination string upload" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string manual" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles dict" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:com.lightningroadside.lightningdispatch string fad4523a-eb05-4d8a-852e-5c79f0fbf01a" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :uploadBitcode bool false" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :stripSwiftSymbols bool true" "$EXPORT_OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :manageAppVersionAndBuildNumber bool true" "$EXPORT_OPTIONS"

          echo "--- ExportOptions.plist ---"
          cat "$EXPORT_OPTIONS"

      - name: Export and upload to TestFlight
        env:
          APPLE_KEY_ID: RR25ZLU234
          APPLE_ISSUER_ID: c7ed6fd2-303c-4b68-9cc7-e43da3dfb5d7
        run: |
          set -euo pipefail
          EXPORT_DIR="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT_DIR"
          echo "EXPORT_DIR=$EXPORT_DIR" >> "$GITHUB_ENV"

          # `destination = upload` in ExportOptions.plist makes xcodebuild upload the
          # exported .ipa directly to App Store Connect (TestFlight), authenticated
          # with the App Store Connect API key. This is the current supported method;
          # `xcrun altool` was removed in Xcode 16.
          xcodebuild \
            -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist "$EXPORT_OPTIONS" \
            -exportPath "$EXPORT_DIR" \
            -authenticationKeyPath "$AUTH_KEY_PATH" \
            -authenticationKeyID "$APPLE_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ISSUER_ID"

          echo "Uploaded archive. Exported artifacts:"
          ls -la "$EXPORT_DIR"

      # `destination = upload` streams the .ipa straight to App Store Connect and
      # leaves the export dir empty, so there is no local .ipa to archive. Keep this
      # step non-fatal so a successful TestFlight upload reads as green.
      - name: Upload .ipa as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lightningdispatch-ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
          retention-days: 14
